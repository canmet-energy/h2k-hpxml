name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      # Don't attempt the on-import dependency check/install during tests.
      H2K_SKIP_AUTO_INSTALL: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        # setup-uv provides an activated .venv. This also resolves openstudio-deps
        # from the pinned git tag via [tool.uv.sources].
        run: uv pip install -e ".[dev]"

      - name: Run unit tests
        # Integration tests (tests/integration/) require an OpenStudio + OpenStudio-HPXML
        # install and a working simulation, so they are not run here. The unit suite is
        # hermetic (dependency-path resolution is mocked where needed).
        run: uv run pytest tests/unit/ -q
