[paths]
# Note: source_h2k_path is not used by h2k-hpxml CLI (use command-line arguments instead)
# This is kept for backward compatibility and documentation purposes only

source_h2k_path = examples
dest_hpxml_path = output/hpxml/
dest_compare_data = output/comparisons/
workflow_temp_path = output/workflows/

[simulation]
flags = --add-component-loads --debug

[weather]
weather_library = historic
weather_vintage = CWEC2020

[nonh2k]
# not used for H2K conversions
timestep = 60 
# not used for H2K conversions
operable_window_avail_days = 3 

[hvac_control]
# default to false
apply_temperature_setback = false 

[translation]
# Pipeline branch: STANDARD (Typical Canadian use) or ASHRAE140 (standard test cases)
mode = STANDARD

[operating_conditions]
# Baseload / occupancy / hot-water targets for translation
# Options: SOC, ROC, General (NOT YET IMPLEMENTED)
mode = SOC

[logging]
log_level = INFO
log_to_file = true
log_file_path = output/logs/h2k_hpxml.log

